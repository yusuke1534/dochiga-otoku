<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#168bdb"><meta name="description" content="値段と内容量を入れるだけ。どっちがお得かすぐわかる無料の単価比較アプリ。"><link rel="manifest" href="manifest.webmanifest?v=3"><link rel="apple-touch-icon" sizes="512x512" href="icon.png?v=3"><title>どっちがお得？｜かんたん単価比較</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#163d5d;background:#eaf6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#d7f0ff,#f5fbff 50%)}button,input,select{font:inherit}button{cursor:pointer}main{max-width:600px;margin:auto;padding:16px 15px 90px}.hero{background:linear-gradient(135deg,#168cda,#0b65b9);color:white;border-radius:26px;padding:17px 18px;display:flex;gap:15px;align-items:center;box-shadow:0 8px 20px #177bbd30}.hero img{width:77px;height:77px;border-radius:19px;object-fit:cover}.hero h1{font-size:24px;letter-spacing:-.04em;margin:0 0 6px}.hero p{font-size:12px;margin:0;opacity:.94}.panel{background:white;border:1px solid #d9ecf9;border-radius:23px;padding:18px;margin-top:15px;box-shadow:0 5px 15px #2a81bd13}.sectiontitle{font-weight:800;font-size:16px;margin:0 0 14px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px;color:#65859b}.units{display:flex;gap:5px;flex-wrap:wrap}.units button{border:1px solid #c6e3f7;background:#f0f8ff;border-radius:11px;color:#2877ae;padding:7px 11px;font-weight:700;font-size:12px}.units button.active{background:#167fd0;color:white;border-color:#167fd0}.product{background:#f0f8ff;border:1px solid #dceefb;border-radius:18px;padding:15px;margin:11px 0}.product:nth-child(odd){background:#f5faff}.phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tag{background:#1787d7;color:white;border-radius:10px;padding:6px 11px;font-weight:800}.remove{border:0;background:transparent;color:#7c96a8;font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#456d87;font-weight:700}.field input,.field select{width:100%;border:1px solid #c9e2f2;background:white;border-radius:12px;padding:11px 9px;min-width:0;color:#143e61;font-size:18px;font-weight:800;outline-color:#178cda}.field select{font-size:15px}.product .extra{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:11px}.product .extra input{font-size:15px}.product .extra select{font-size:15px}.add{width:100%;border:2px dashed #9acff1;background:#f4faff;color:#1678bb;border-radius:15px;padding:13px;font-weight:800}.result{background:linear-gradient(180deg,#fff,#f7fcff);text-align:center}.winner{font-size:26px;font-weight:900;color:#168c64;margin:10px 0}.saving{font-size:14px;font-weight:700;color:#20805f;margin-bottom:12px}.prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pricebox{border-radius:14px;padding:12px 5px;background:#eff5f9}.pricebox.best{background:#def7e9;border:2px solid #8dd8ad}.pricebox .name{font-size:12px;color:#50718a}.pricebox strong{display:block;font-size:20px;margin-top:5px}.buttons{display:flex;gap:10px;margin-top:14px}.primary,.secondary{border:0;border-radius:14px;padding:13px 12px;font-weight:800;flex:1}.primary{background:#1386d8;color:white;box-shadow:0 4px 10px #1386d82c}.secondary{background:#e8f4fc;color:#236d9e}.historyitem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4eff7;padding:12px 0;gap:8px}.historyitem:last-child{border:0}.savebar{display:flex;gap:10px;align-items:stretch;margin-top:14px}.savebar input{width:44%;min-width:0;border:1px solid #c9e2f2;border-radius:13px;padding:10px;font-size:16px;color:#163d5d;background:#fff}.savebar .primary{min-width:0}.historyactions{display:flex;gap:6px;flex-shrink:0}.historyitem .deleteone{background:#fff0f0;color:#b83d47}.historyitem button{border:0;background:#e8f4fc;border-radius:9px;padding:8px 10px;color:#176fa8;font-weight:700}.empty{color:#7c94a5;font-size:13px;text-align:center;padding:10px}.foot{text-align:center;color:#66869b;font-size:11px;margin-top:18px}.notice{font-size:12px;color:#708a9e;margin:10px 0 0;line-height:1.6}@media(max-width:380px){.hero h1{font-size:21px}.hero img{width:64px;height:64px}.panel{padding:13px}.field input{font-size:16px}}
</style></head><body><main><header class="hero"><img src="icon.png" alt="AとBの値札ロゴ"><div><h1>どっちがお得？</h1><p>値段と量を入れるだけ！かんたん比較</p></div></header><section class="panel"><div class="topline"><h2 class="sectiontitle">🛒 商品を比較</h2><span class="small">入力すると自動計算</span></div><div class="topline" style="margin-bottom:12px"><span class="small">比べる単位</span><div class="units" id="units"></div></div><div id="products"></div><button class="add" id="add">＋ 比較する商品を追加</button><div class="buttons"><button class="secondary" id="reset">↻ リセット</button></div><div class="savebar"><input id="comparisonName" type="text" maxlength="60" aria-label="保存する商品名" placeholder="商品名（例：洗剤）"><button class="primary" id="save">☆ この比較を保存</button></div></section><section class="panel result" aria-live="polite"><div class="small">✨ 比較結果</div><div id="result"></div></section><section class="panel"><div class="topline"><h2 class="sectiontitle">🕘 比較履歴</h2><button class="remove" id="clear">履歴を消去</button></div><div id="history"></div></section><p class="foot">会員登録不要・無料・入力内容はこの端末に保存されます · v3</p></main><script>
const KEY='dochiga-otoku-history-v1';const categories={g:['g','kg'],ml:['ml','L'],個:['個'],枚:['枚'],本:['本']};let category='g';let products=[{price:'298',qty:'450',unit:'g',packs:'1'},{price:'398',qty:'650',unit:'g',packs:'1'}];let history=[];try{history=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}
const $=id=>document.getElementById(id);const yen=n=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const baseUnit=u=>u==='kg'?'g':u==='L'?'ml':u;const factor=u=>(u==='kg'||u==='L')?1000:1;function amount(p){return Number(p.qty)*factor(p.unit)*Number(p.packs)}function rate(p){const a=amount(p),v=Number(p.price);return a>0&&v>=0&&Number.isFinite(v)?v/a:NaN}function renderUnits(){ $('units').innerHTML=Object.keys(categories).map(c=>`<button data-cat="${c}" class="${category===c?'active':''}">${c}</button>`).join('');$('units').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;products=products.map(p=>({...p,unit:categories[category][0]}));render()})}
function renderProducts(){ $('products').innerHTML=products.map((p,i)=>`<div class="product"><div class="phead"><span class="tag">商品 ${String.fromCharCode(65+i)}</span>${products.length>2?`<button class="remove" data-remove="${i}">✕ 削除</button>`:''}</div><div class="fields"><label class="field">値段（税込・円）<input type="number" min="0" step="any" inputmode="decimal" data-i="${i}" data-k="price" value="${esc(p.price)}" placeholder="例：298"></label><label class="field">内容量<select data-i="${i}" data-k="unit">${categories[category].map(u=>`<option ${p.unit===u?'selected':''} value="${u}">${u}</option>`).join('')}</select></label></div><div class="extra"><label class="field">量（${p.unit}）<input type="number" min="0" step="any" inputmode="decimal" data-i="${i}" data-k="qty" value="${esc(p.qty)}" placeholder="例：450"></label><label class="field">入り数（袋・本など）<input type="number" min="1" step="1" inputmode="numeric" data-i="${i}" data-k="packs" value="${esc(p.packs)}"></label></div></div>`).join('');$('products').querySelectorAll('input,select').forEach(el=>{el.addEventListener('input',()=>{products[Number(el.dataset.i)][el.dataset.k]=el.value;renderResult()});el.addEventListener('change',()=>{products[Number(el.dataset.i)][el.dataset.k]=el.value;if(el.dataset.k==='unit')renderProducts();renderResult()})});$('products').querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{products.splice(Number(el.dataset.remove),1);renderProducts();renderResult()});$('add').disabled=products.length>=8;$('add').textContent=products.length>=8?'最大8商品まで比較できます':'＋ 比較する商品を追加'}
function renderResult(){const rs=products.map(rate);if(rs.some(n=>!Number.isFinite(n))||products.some(p=>Number(p.qty)<=0||Number(p.packs)<=0||!Number.isInteger(Number(p.packs)))){$('result').innerHTML='<p class="empty">価格は0以上、内容量と入り数は正しい数値を入力してください。</p>';return}const best=Math.min(...rs),winners=rs.map((v,i)=>Math.abs(v-best)<1e-10?i:-1).filter(i=>i>=0);const label=category==='g'?'100g':category==='ml'?'100ml':`1${category}`;const scale=(category==='g'||category==='ml')?100:1;const high=Math.max(...rs);const pct=high>0?(1-best/high)*100:0;$('result').innerHTML=`<div class="winner">${winners.length===products.length?'どの商品も同じ単価！':`🏆 商品 ${winners.map(i=>String.fromCharCode(65+i)).join('・')} がお得！`}</div><div class="saving">${winners.length===products.length?'単価に差はありません':`最も高い商品より約${yen(pct)}%割安`}</div><div class="prices">${rs.map((v,i)=>`<div class="pricebox ${winners.includes(i)?'best':''}"><span class="name">商品 ${String.fromCharCode(65+i)} ／ ${label}あたり</span><strong>${yen(v*scale)}円</strong></div>`).join('')}</div><p class="notice">同じ種類・品質の商品を比較してください。税込・税抜の条件も揃えてください。割安率は最高単価を基準に計算しています。</p>`}
function renderHistory(){$('history').innerHTML=history.length?history.map((h,i)=>`<div class="historyitem"><div><strong>${h.name?esc(h.name):"名前なしの比較"}</strong><div class="small">${esc(h.date)} ／ ${h.products.length}商品・${esc(h.category)}で比較</div></div><div class="historyactions"><button data-load="${i}">呼び出す</button><button class="deleteone" data-delete="${i}" aria-label="${h.name?esc(h.name):"比較"}を削除">削除</button></div></div>`).join(''):'<p class="empty">保存した比較はまだありません</p>';$('history').querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const h=history[Number(b.dataset.load)];category=h.category;products=h.products.map(p=>({...p}));render();$('comparisonName').value=h.name||'';scrollTo({top:0,behavior:'smooth'})});$('history').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.delete);if(confirm('「'+(history[i].name||'名前なしの比較')+'」を削除しますか？')){history.splice(i,1);localStorage.setItem(KEY,JSON.stringify(history));renderHistory()}})}function render(){renderUnits();renderProducts();renderResult();renderHistory()}
$('add').onclick=()=>{if(products.length>=8)return;products.push({price:'',qty:'',unit:categories[category][0],packs:'1'});renderProducts();renderResult()};$('reset').onclick=()=>{$('comparisonName').value='';products=[{price:'',qty:'',unit:categories[category][0],packs:'1'},{price:'',qty:'',unit:categories[category][0],packs:'1'}];renderProducts();renderResult()};$('save').onclick=()=>{if(products.some(p=>!Number.isFinite(rate(p))||Number(p.qty)<=0||Number(p.packs)<=0||!Number.isInteger(Number(p.packs)))){alert('正しい価格・内容量・入り数を入力してください');return}history.unshift({name:$('comparisonName').value.trim(),date:new Date().toLocaleString('ja-JP'),category,products:products.map(p=>({...p}))});history=history.slice(0,30);try{localStorage.setItem(KEY,JSON.stringify(history));renderHistory();alert('比較を保存しました')}catch(e){alert('保存できませんでした。ブラウザの保存設定を確認してください')}};$('clear').onclick=()=>{if(confirm('保存した比較履歴をすべて削除しますか？')){history=[];localStorage.removeItem(KEY);renderHistory()}};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=3', {updateViaCache:'none'}).catch(()=>{}));
</script></body></html>
